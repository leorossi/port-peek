name: Bug report
description: Report a wrong result, crash, or platform problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets and sensitive paths from
        command lines before posting. `portpeek --no-command` hides `argv`/`cmd`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command you ran, with the port redacted if needed.
      placeholder: portpeek 8080 --json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the output (use `--no-command` when sharing).
      render: shell
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to see?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Linux aarch64
        - Other (describe above)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: portpeek version
      description: Output of `portpeek --version`.
      placeholder: portpeek 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - GitHub release archive
        - cargo install
        - Built from source
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I am using the latest release.
          required: true
        - label: I removed secrets and sensitive paths from the output.
          required: true
