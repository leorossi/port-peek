[package]
name = "portpeek"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Find the process listening on a local port, including its command line and working directory"
authors = ["Leonardo Rossi"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leorossi/portpeek"
homepage = "https://github.com/leorossi/portpeek"
documentation = "https://docs.rs/portpeek"
readme = "README.md"
keywords = ["port", "process", "network", "cli", "lsof"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", "PLAN.md"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
